name: SHN Tide Scraper

on:
  schedule:
    # 17:00 UTC es exactamente las 14:00 en Argentina (UTC-3)
    - cron: '0 17 * * *'
  workflow_dispatch:
    # Permite ejecutar el scraper de forma manual desde la pestaña Actions en GitHub
    inputs:
      simulate_date:
        description: 'Fecha simulada (YYYY-MM-DD) para probar el envío mensual. Ej: 2026-07-15 o 2026-08-01. Dejar vacío para usar la fecha real.'
        required: false
        default: ''

# Se requieren permisos de escritura para que el token de GitHub pueda hacer push de los datos
permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Acelera las ejecuciones subsecuentes cacheando dependencias

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Ejecutar script de Web Scraping
      run: |
        # Por defecto extrae solo Puerto Belgrano (PTBL) como se solicitó.
        # Para extraer todos los puertos en el futuro, puedes cambiar este comando por:
        # python scraper.py --all
        python scraper.py --ports PTBL

    - name: Generar tabla resumen Puerto Belgrano
      run: python generate_summary.py

    - name: Confirmar cambios y empujar al repositorio
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        # Agregamos todo el contenido de data (CSVs y resumen) y docs (página web)
        git add data/ docs/
        
        # Verificamos si hay cambios locales para evitar que falle el comando git commit si no hay cambios
        if git diff --cached --quiet; then
          echo "No se detectaron nuevos cambios en los datos de mareas para confirmar."
        else
          git commit -m "chore(data): Actualización automática de mareas - $(date +'%Y-%m-%d')"
          git push
        fi

    - name: Enviar resumen mensual por email
      env:
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
      run: python send_monthly_report.py ${{ github.event.inputs.simulate_date && format('--date {0}', github.event.inputs.simulate_date) || '' }}
